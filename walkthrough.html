<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Devon Home 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Marcellus&display=swap">
<style>
/* Layout: full-bleed 3D canvas with a top bar (floor + view switch) and a bottom room strip. One deliberate light-on-dark chrome look. */
:root{
  --chrome:#1E1B18; --chrome-2:#2A2622; --ink:#F1EBE1; --muted:#B5AB9D; --brass:#CDA862; --line:#3D3833;
  --display:"Marcellus", Georgia, serif; --sans:"Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%; margin:0}
body{background:#E7E1D7; color:var(--ink); font:400 15px/1.5 var(--sans); overflow:hidden}
#stage{position:fixed; inset:0; touch-action:none}
#stage canvas{display:block; width:100%; height:100%; outline:none}
.bar{position:fixed; left:0; right:0; z-index:3; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px))}
.top{top:0; padding-top:calc(10px + env(safe-area-inset-top,0px)); padding-bottom:10px; background:linear-gradient(var(--chrome), rgba(30,27,24,.0)); pointer-events:none}
.top > *{pointer-events:auto}
.back{color:var(--ink); text-decoration:none; font-size:14px; padding:7px 12px; border-radius:999px; background:rgba(30,27,24,.75); border:1px solid var(--line)}
.title{font-family:var(--display); font-size:20px; margin-right:auto; text-shadow:0 1px 8px rgba(0,0,0,.5)}
.seg{display:inline-flex; background:rgba(30,27,24,.8); border:1px solid var(--line); border-radius:999px; padding:3px}
.seg button{font:500 13px var(--sans); color:var(--muted); background:transparent; border:0; border-radius:999px; padding:6px 13px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--chrome)}
.bottom{bottom:0; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); padding-top:28px; flex-direction:column; align-items:stretch; gap:10px;
  background:linear-gradient(rgba(30,27,24,0), rgba(30,27,24,.92) 45%)}
.info{display:flex; gap:6px 16px; align-items:baseline; flex-wrap:wrap}
.info h1{font:400 26px/1.1 var(--display); margin:0}
.info p{margin:0; color:var(--muted); font-size:14px; max-width:70ch}
.rooms{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.rooms button{flex:none; font:500 13px var(--sans); color:var(--ink); background:var(--chrome-2); border:1px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer; white-space:nowrap}
.rooms button[aria-pressed="true"]{border-color:var(--brass); color:var(--brass)}
.rooms .sep{flex:none; width:1px; background:var(--line); margin:4px 2px}
.hint{font-size:12px; color:var(--muted)} .credit{opacity:.75}
button:focus-visible, a:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
#status{position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:4; pointer-events:none; background:rgba(30,27,24,.82); color:var(--ink); font:500 13px var(--sans); padding:6px 14px; border-radius:999px}
@media (max-width:560px){ .title{font-size:17px} .info h1{font-size:21px} }
</style>
</head>
<body>
<div id="stage" aria-label="3D model of the house"></div>
<div id="status">Building the house…</div>
<div class="bar top">
  <a class="back" href="index.html">← Plan</a>
  <span class="title">Our Devon Home</span>
  <div class="seg" role="group" aria-label="Floor">
    <button type="button" id="f-main" aria-pressed="true">Main floor</button>
    <button type="button" id="f-upper" aria-pressed="false">Upper floor</button>
  </div>
</div>
<div class="bar bottom">
  <div class="info"><h1 id="rname">Main floor</h1><p id="rdesc"></p></div>
  <div class="rooms" id="rooms" role="group" aria-label="Rooms"></div>
  <div class="hint"><span id="hint"></span> <span class="credit">· Sofa, chairs, pouf, plant and vase are real 3D product models from the Khronos glTF sample library (Wayfair; CC BY 4.0 and CC0).</span></div>
</div>

  for(let i=0;i<7000;i++){ g.fillStyle=r()>.5?'rgba(250,244,234,.22)':'rgba(110,95,78,.18)'; g.fillRect(r()*w,r()*h,2,1);} g.strokeStyle='rgba(110,95,78,.35)'; g.lineWidth=6; g.strokeRect(10,10,w-20,h-20); });
const M = {
  wall: mat(0xE9E2D7, .95), ceil: mat(0xF7F4EF, 1), trim: mat(0xF8F5F0, .55), slab: mat(0xCFC6B8, .95),
  linen: mat(0xCFC4B3, 1), linen2: mat(0xD9CFBF, 1), ivory: mat(0xEDE6DA, 1), boucle: mat(0xDCD2C4, 1),

  oak: mat(0xB8925F, .62), walnut: mat(0x6B4A33, .55), brass: mat(0xC09A4E, .32, .85),
  quartz: mat(0xF3F1ED, .25), cab: mat(0xE3DDD2, .55), island: mat(0x2E2B28, .55), steel: mat(0xC4C7C8, .3, .85),
  glass: new THREE.MeshStandardMaterial({color:lin(0xBFD6DE), roughness:.05, metalness:.1, transparent:true, opacity:.18}),
  screen: mat(0x0D0E0F, .2), fire: new THREE.MeshStandardMaterial({color:0xF5A54B, emissive:0xE57A27, emissiveIntensity:1.8}),
  shade: new THREE.MeshStandardMaterial({color:0xF8F2E7, emissive:0xFFDDAA, emissiveIntensity:.55, roughness:1, side:THREE.DoubleSide}),

// ---------- chairs and seating
function diningChair(g, cx, cz, rot, y0){ const c=new THREE.Group(); c.position.set(cx, y0, cz); c.rotation.y=rot; g.add(c);

const gltfLoader = new GLTFLoader(); const glbCache = {};
function loadGLB(f){ if (!glbCache[f]) glbCache[f] = gltfLoader.loadAsync('models/' + f + '.json'); return glbCache[f]; }
async function applyVariant(gltf, root, name){
  const ext = gltf.parser.json.extensions && gltf.parser.json.extensions.KHR_materials_variants; if (!ext) return;
  const vi = ext.variants.findIndex(function(v){ return v.name === name; }); if (vi < 0) return;
  const jobs = [];
  root.traverse(function(o){ if (!o.isMesh) return; const ud = o.userData.gltfExtensions && o.userData.gltfExtensions.KHR_materials_variants; if (!ud) return;
    const mp = ud.mappings.find(function(m){ return m.variants.indexOf(vi) >= 0; });
    if (mp) jobs.push(gltf.parser.getDependency('material', mp.material).then(function(mt){ o.material = mt; })); });
  await Promise.all(jobs);
}
async function placeModel(o){
  const gltf = await loadGLB(o.file); const root = gltf.scene.clone(true);
  if (o.variant) await applyVariant(gltf, root, o.variant);
  root.traverse(function(m){ if (!m.isMesh) return; m.castShadow = true; m.receiveShadow = true;
    if (o.tint != null){ const list = Array.isArray(m.material) ? m.material : [m.material];
      const nm = list.map(function(mt){ if (!/fabric|silk|velvet/i.test(mt.name || '')) return mt; const c = mt.clone(); c.map = null; c.color = new THREE.Color(o.tint);
        if (c.sheenColor) c.sheenColor = new THREE.Color(o.tint).lerp(new THREE.Color(0xffffff), .25); if (o.noAO) c.aoMap = null; return c; });
      m.material = Array.isArray(m.material) ? nm : nm[0]; }
    if (/label/i.test((m.material && m.material.name) || '')) m.visible = false; });
  const b = new THREE.Box3().setFromObject(root), sz = b.getSize(new THREE.Vector3());
  root.scale.setScalar(o.w ? o.w / sz.x : o.h / sz.y);
  const b2 = new THREE.Box3().setFromObject(root), c = b2.getCenter(new THREE.Vector3());
  root.position.set(-c.x, o.y - b2.min.y, -c.z);
  const pivot = new THREE.Group(); pivot.position.set(o.x, 0, o.z); pivot.rotation.y = o.rot || 0; pivot.add(root); o.g.add(pivot);
}

const orbit = new OrbitControls(camera, renderer.domElement);

const keys = {};
function setLookFromTarget(pos, tgt){ const d=new THREE.Vector3(tgt[0]-pos[0], tgt[1]-pos[1], tgt[2]-pos[2]).normalize(); yaw=Math.atan2(d.x, d.z); pitch=Math.asin(d.y); }
function applyLook(){ const d=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch)); camera.lookAt(camera.position.clone().add(d)); }
const el = renderer.domElement; const pointers = new Map();
el.addEventListener('pointerdown', function(e){ if(mode!=='room') return; pointers.set(e.pointerId, {x:e.clientX, y:e.clientY}); el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', function(e){ if(mode!=='room' || !pointers.has(e.pointerId)) return; const p=pointers.get(e.pointerId);
  if (pointers.size===1){ yaw -= (e.clientX-p.x)*0.005; pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY-p.y)*0.004)); }
  else if (pointers.size===2){ const pts=[...pointers.values()]; const before=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y); p.x=e.clientX; p.y=e.clientY; const now=[...pointers.values()]; const after=Math.hypot(now[0].x-now[1].x, now[0].y-now[1].y); zoom((before-after)*0.08); return; }
  p.x=e.clientX; p.y=e.clientY; });
['pointerup','pointercancel'].forEach(function(t){ el.addEventListener(t, function(e){ pointers.delete(e.pointerId); }); });
el.addEventListener('wheel', function(e){ if(mode!=='room') return; e.preventDefault(); zoom(e.deltaY*0.02); }, {passive:false});
function zoom(d){ camera.fov = Math.max(30, Math.min(80, camera.fov + d)); camera.updateProjectionMatrix(); }
window.addEventListener('keydown', function(e){ keys[e.key.toLowerCase()] = true; });

const isTouch = matchMedia('(pointer: coarse)').matches;
function renderRoomButtons(){ roomsEl.innerHTML=''; ROOMS[floor].forEach(function(r, i){ if(i===1){ const s=document.createElement('span'); s.className='sep'; roomsEl.appendChild(s); }

function setFloor(f){ floor=f; document.getElementById('f-main').setAttribute('aria-pressed', String(f==='main')); document.getElementById('f-upper').setAttribute('aria-pressed', String(f==='upper')); }
function go(id){ let r=null, f=null; ['main','upper'].forEach(function(k){ ROOMS[k].forEach(function(x){ if(x.id===id){ r=x; f=k; } }); }); if(!r) return;

    hintEl.textContent = isTouch ? 'Drag to turn · pinch to zoom · tap a room to step inside' : 'Drag to turn · scroll to zoom · right-drag to move · pick a room to step inside'; }
  else { mode='room'; orbit.enabled=false; camera.fov=66; camera.position.set(r.pos[0], r.pos[1], r.pos[2]); setLookFromTarget(r.pos, r.tgt);
    groups.upper.visible=true; groups.ceilMain.visible=true; groups.ceilUpper.visible=true;
    hintEl.textContent = isTouch ? 'Drag to look around · pinch to zoom' : 'Drag to look around · scroll to zoom · W A S D to step'; }

(function loop(){ requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(), .05);

    if (keys['w']||keys['arrowup']) camera.position.addScaledVector(fwd, sp); if (keys['s']||keys['arrowdown']) camera.position.addScaledVector(fwd, -sp);
